{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<div class="modal-overlay" id="filter-modal-overlay">
    <div class="modal-box filter-modal">
        <h3>{% translate "Filtering" %}</h3>
        <div class="filter-grid">
            <div class="filter-group">
                <label>{% translate "Price ($)" %}</label>
                <div class="range-inputs">
                    <input type="number" id="filter-price-min" placeholder="{% translate 'Min' %}">
                    <input type="number" id="filter-price-max" placeholder="{% translate 'Max' %}">
                </div>
            </div>
            <div class="filter-group">
                <label>{% translate "Color" %}</label>
                <input type="text" id="filter-color" placeholder="{% translate 'For example: Black' %}">
            </div>
            <div class="filter-group">
                <label>{% translate "Region" %}</label>
                <input type="text" id="filter-region" placeholder="{% translate 'For example: California' %}">
            </div>
            <div class="filter-group">
                <label>{% translate "Rating" %}</label>
                <select id="filter-rating">
                    <option value="">{% translate "All" %}</option>
                    <option value="4.5">4.5+</option>
                    <option value="4.0">4.0+</option>
                    <option value="3.5">3.5+</option>
                </select>
            </div>
            <div class="filter-group">
                <label>{% translate "Relevance" %}</label>
                <select id="filter-sort">
                    <option value="relevance">{% translate "Recommended" %}</option>
                    <option value="price_asc">{% translate "Cheapest" %}</option>
                    <option value="price_desc">{% translate "Most expensive" %}</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="filter-cancel">{% translate "Cancel" %}</button>
            <button class="btn-confirm" id="filter-confirm">{% translate "OK" %}</button>
        </div>
    </div>
</div>

<div class="chat-container" id="chat-container">
</div>

<div class="chat-container ai-chat-mode-container" id="ai-chat-container" style="display: none;">
    <div id="ai-chat-messages" class="ai-chat-messages">
        <div class="ai-chat-welcome">
            <h2>{% translate "Chat with Findle AI" %}</h2>
        </div>
    </div>
</div>
{% endblock %}
